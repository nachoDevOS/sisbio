; Ajustes de PHP para SisMark en producción.

memory_limit = 512M
max_execution_time = 300

; El import de marcaciones sube el CSV que exporta «Equipos > Exportar»: un
; equipo con años de historial deja archivos de varios MB.
upload_max_filesize = 32M
post_max_size = 32M

expose_php = Off
date.timezone = America/La_Paz

; Los errores van al log de Laravel y al stdout del contenedor, nunca a la
; respuesta HTTP.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código no cambia dentro de una imagen: no hace falta que PHP mire los
; mtime en cada petición.
opcache.validate_timestamps = 0
